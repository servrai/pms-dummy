# Dev deploy: ONE job, build → push → rollout → gate (owner directive
# 2026-10-27: every PR and every main commit deploys; latest push wins on
# the shared dev box). LIGHT task — builds and deploys are light; the
# e2e/test fleets are the heavy class.
name: dev deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: true   # latest deploy wins on the shared dev box

jobs:
  build_and_deploy:
    name: build & deploy dev
    # Public repo + self-hosted runner: never run fork PR code on dev2
    # (restores the pre-refactor guard).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, servr-light]
    timeout-minutes: 20
    env:
      BUILDX_BUILDER: pms-dummy-builder
      SERVR_HOME: /home/dcversus/servr-dev
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          name: pms-dummy-builder
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              max-parallelism = 4
            [[worker.oci.gcpolicy]]
              all = true
              reservedSpace = "10GB"
              maxUsedSpace = "20GB"
      - name: Derive tags
        id: tags
        run: |
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dev=localhost:5000/${repo_lc}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dev=localhost:5000/${repo_lc}:dev" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=localhost:5000/${repo_lc}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          cache-from: type=local,src=/home/dcversus/.buildx-cache/pms-dummy
          cache-to: type=local,dest=/home/dcversus/.buildx-cache/pms-dummy,mode=max,reset=true
          tags: |
            ${{ steps.tags.outputs.dev }}
            ${{ steps.tags.outputs.sha }}
      - name: Push tags (host registry)
        run: |
          docker push "${{ steps.tags.outputs.dev }}"
          docker push "${{ steps.tags.outputs.sha }}"
      - name: Rollout (this run's :sha onto the compose pin) + gate + probe
        run: |
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cd "$SERVR_HOME"
          docker pull "localhost:5000/${repo_lc}:sha-${GITHUB_SHA::7}"
          svc_image=$(docker compose config pms-dummy 2>/dev/null | sed -n 's/^ *image: *//p' | head -1)
          [ -n "$svc_image" ] || svc_image="localhost:5000/${repo_lc}:dev"
          docker tag "localhost:5000/${repo_lc}:sha-${GITHUB_SHA::7}" "$svc_image"
          docker compose up -d --no-deps pms-dummy
          want_id=$(docker image inspect "$svc_image" --format '{{.Id}}')
          got_id=$(docker inspect "$(docker compose ps -q pms-dummy)" --format '{{.Image}}')
          [ "$want_id" = "$got_id" ] || { echo "rollout no-op: pms-dummy runs ${got_id}, expected ${want_id}" >&2; exit 1; }
          for i in $(seq 1 20); do
            docker compose exec -T pms-dummy wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 && { echo "ok"; exit 0; }
            sleep 3
          done
          echo "pms-dummy not ready" >&2; exit 1

  # Blackbox e2e against the just-deployed public URL — the heavy class.
  e2e-blackbox:
    name: e2e blackbox
    needs: build_and_deploy
    if: always() && needs.build_and_deploy.result == 'success'
    runs-on: [self-hosted, servr-heavy]
    timeout-minutes: 15
    container:
      image: golang:1.26
      options: --user 1000
    env:
      HOME: /github/home
      BASE_URL: https://pms-dummy-dev.servr.ai
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - name: go test ./e2e
        run: go test ./e2e -v -timeout 10m
