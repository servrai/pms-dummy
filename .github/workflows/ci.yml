# CI: vet + unit tests + build. Runs on the dev2 self-hosted runner inside a
# golang container — the host has no Go toolchain by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, servr-dev2]
    timeout-minutes: 15
    # Run the job container as the runner user (uid 1000 on dev2). As root it
    # left root-owned files across the bind-mounted workspace (_work/.git, go
    # caches) and the next job's checkout died with EACCES (2026-10-21).
    container:
      image: golang:1.26
      options: --user 1000
    env:
      HOME: /github/home
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./internal/... -count=1
      - name: build
        run: go build -buildvcs=false ./...
        # -buildvcs=false: the checkout's .git is owned by the host user, so
        # VCS stamping fails with "error obtaining VCS status" in the job
        # container.
